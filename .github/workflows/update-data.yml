name: Update lottery data

on:
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions
  schedule:
    # วันที่ 1, 2, 16, 17 ของเดือน เวลา 12:00 UTC (19:00 น. ไทย) เผื่อกรณีเลื่อนงวด
    - cron: "0 12 1,2,16,17 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch data
        run: node scripts/fetch-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          git diff --staged --quiet || (git commit -m "chore: update lottery data" && git push)
